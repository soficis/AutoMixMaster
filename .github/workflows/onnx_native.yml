name: Native ONNX Runtime CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: onnx-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ort:
    name: Native ORT (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cmake_args: "-G Ninja"
          - os: ubuntu-24.04-arm
            cmake_args: "-G Ninja"
          - os: windows-latest
            cmake_args: "-A x64"
          - os: macos-15
            cmake_args: "-G Ninja"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config curl ffmpeg \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libglu1-mesa-dev mesa-common-dev libcurl4-openssl-dev

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install ninja ffmpeg

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Cache fetched dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/_deps
          key: deps-ort-1.30.0-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('cmake/FetchOnnxRuntime.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            deps-ort-1.30.0-${{ matrix.os }}-${{ runner.arch }}-

      - name: Configure CMake
        run: >
          cmake -S . -B build
          ${{ matrix.cmake_args }}
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_ONNX=ON
          -DAUTOMIX_FETCH_ORT=ON
          -DAUTOMIX_ORT_FLAVOR=cpu
          -DBUILD_TESTING=ON
          -DBUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Run Tests (Full Suite)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: HTTPS download smoke (Linux, curl)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          tools_bin="$(find build -type f -name automix_dev_tools -perm -u+x | head -n1)"
          test -n "$tools_bin"
          ok=0
          for attempt in 1 2 3; do
            if "$tools_bin" model browse --limit 1 --out browse.json; then
              if python3 -c "import json,sys; d=json.load(open('browse.json')); sys.exit(0 if len(d)>=1 else 1)"; then ok=1; break; fi
            fi
            sleep 10
          done
          test "$ok" = 1

name: ThreadSanitizer Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tsan:
    name: TSan (Clang, Ubuntu)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 lld-18 \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libglu1-mesa-dev mesa-common-dev libcurl4-openssl-dev

      - name: Configure (TSan)
        run: >
          cmake -S . -B build-tsan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
          -DBUILD_TESTING=ON
          -DBUILD_TOOLS=ON
          -DENABLE_SANITIZERS=OFF

      - name: Build
        run: cmake --build build-tsan --parallel $(nproc) 2>&1

      - name: Run Tests under TSan
        run: |
          export TSAN_OPTIONS="halt_on_error=1:report_atomic_races=1:history_size=7:second_deadlock_stack=1"
          ctest --test-dir build-tsan --output-on-failure -j4
        shell: bash

      - name: Upload TSan Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-logs
          path: |
            build-tsan/Testing/Temporary/
            tsan_log.*
          if-no-files-found: ignore
